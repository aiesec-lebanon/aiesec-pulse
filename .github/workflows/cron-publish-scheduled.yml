name: Publish scheduled posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/publish-scheduled
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PULSE_BASE_URL }}/api/cron/publish-scheduled")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
